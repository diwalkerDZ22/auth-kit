<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>auth-kit</title>
    <!-- Thème choisi appliqué avant le premier rendu (pas de flash) : THEME_INIT_SCRIPT de @auth-kit/react/ui -->
    <script>try{var t=localStorage.getItem('auth-kit-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body class="ak-backdrop">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
