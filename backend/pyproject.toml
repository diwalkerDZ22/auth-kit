[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-kit"
version = "0.8.0"
description = "Authentification et autorisation pour FastAPI : sessions par appareil, connexion par email, rôles."
readme = "README.md"
requires-python = ">=3.11"
# Bornes larges : c'est une bibliothèque, le projet qui l'installe fixe les versions exactes.
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.1,<6",
    "limits>=3.13,<6",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
resend = ["resend>=2.0,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5,<7"]
dotenv = ["python-dotenv>=1.0,<2"]

[project.scripts]
auth-kit = "auth_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auth_kit = ["py.typed", "migrations/README", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
